name: PartyUp Windows

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: partyup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: partyup/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        shell: bash
        run: npm run build
      - name: Package
        shell: bash
        run: npx electron-builder --config electron-builder.yml --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Upload
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release create "v$VERSION" --title "PartyUp $VERSION" --notes "First launch asks for a profile. Sidebar pages open. Languages: EN ES FR DE JA ZH RU PT IT. Local launch, verify, backup, and SHA256. No DLC unlockers, Hydra, or depot downloads."
          fi
          gh release upload "v$VERSION" dist/*.exe dist/*.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
