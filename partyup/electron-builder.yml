appId: com.partyup.desktop
productName: PartyUp
copyright: "Copyright © 2026 PartyUp Team"
directories:
  output: dist
  buildResources: build
files:
  - dist/**/*
  - src/resources/**/*
  - plugins/**/*
  - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  publisherName: PartyUp Team
  icon: assets/icon.ico
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: PartyUp
  uninstallDisplayName: PartyUp
  license: LICENSE.txt
  include: installer.nsh
  artifactName: PartyUp-Setup-${version}.${ext}
publish:
  - provider: github
    owner: xami666999-lgtm
    repo: partyup